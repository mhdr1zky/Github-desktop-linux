name: Native Rust

on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev xvfb
      - name: Install pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Backend-only tests
        run: cargo test --locked --no-default-features
      - name: GUI and integration tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Native window smoke test
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/release/gitrust-desktop --no-persist --smoke-test ..
      - uses: actions/upload-artifact@v4
        with:
          name: gitrust-desktop-linux-x86_64
          path: native/target/release/gitrust-desktop
