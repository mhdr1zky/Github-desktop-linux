[package]
name = "gitrust-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A lightweight native Linux Git client"

[features]
default = ["glow"]
gui = ["dep:eframe"]
glow = ["gui", "eframe/glow"]
wgpu = ["gui", "eframe/wgpu"]

[dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "x11", "wayland", "accesskit"] }
git2 = { version = "=0.20.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gitrust-desktop"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
